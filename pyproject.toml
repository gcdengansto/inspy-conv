[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspy-conv"
version = "0.3.3"
description = "Toolkit for inelastic neutron scattering resolution calculation and resolution convolution data fitting"
readme = "README.md"
requires-python = ">=3.8"

authors = [
    { name = "Guochu Deng", email = "gc.deng.ansto@gmail.com" }
]



license = "MIT"
license-files = ["LICEN[CS]E*"]


dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.5",
    "scipy>=1.7",
    "pandas>=1.3",
    "lmfit>=1.0",
    "h5py>=3.0",
    "plotly>=5.0",
    "QtPy",
    "PySide6"
]

keywords = ["neutron", "scattering", "resolution", "spectrometer", "triple-axis", "time-of-flight"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/gcdengansto/inspy"
Repository = "https://github.com/gcdengansto/inspy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inspy = [
          "database/*.json",
          "gui/ui/*.ui",
          ]

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[project.scripts]
inspy-conv = "inspy.__main__:main"


